name: iOS simulator diagnostics

# 仅用于诊断：在 macOS runner 的 iOS 模拟器里启动 App，抓启动日志和截图。
# 手动触发，或修改本文件时自动触发。

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-simulator.yml'
      - 'entry/src/main/ets/**'
      - '.arkui-x/ios/arkui-x/**'
      - '.arkui-x/ios/app/**'

permissions:
  contents: write
  checks: write

jobs:
  sim:
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache ArkUI-X macOS SDK
        uses: actions/cache@v4
        with:
          path: /tmp/arkui-x-macos-sdk.zip
          key: arkui-x-macos-sdk-26.0.0.28

      - name: Download libarkui_ios.xcframework
        run: |
          set -euo pipefail
          SDK_URL="https://contentcenter-drcn.dbankcdn.cn/pub_1/DevEcoSpace_1_900_9/6f/v3/x-GBbqu3So2gK5Y1dc-Blw/nxSlk9koR_-dKDUKV4c26Q.zip"
          SDK_SHA256="ee213c09196d4f0433273b65b7c6665083fbb7cef186257fe4bba382744fc9d0"
          if [ ! -f /tmp/arkui-x-macos-sdk.zip ]; then
            curl -L --fail --retry 3 "$SDK_URL" -o /tmp/arkui-x-macos-sdk.zip
          fi
          echo "$SDK_SHA256  /tmp/arkui-x-macos-sdk.zip" | shasum -a 256 -c -
          rm -rf /tmp/arkui-x-framework && mkdir -p /tmp/arkui-x-framework
          unzip -q /tmp/arkui-x-macos-sdk.zip \
            'arkui-x/engine/xcframework/arkui/ios-release/libarkui_ios.xcframework/*' \
            -d /tmp/arkui-x-framework
          mkdir -p .arkui-x/ios/frameworks
          rm -rf .arkui-x/ios/frameworks/libarkui_ios.xcframework
          cp -R /tmp/arkui-x-framework/arkui-x/engine/xcframework/arkui/ios-release/libarkui_ios.xcframework \
            .arkui-x/ios/frameworks/

      - name: Download and link ArkUI-X plugin frameworks
        run: |
          set -euo pipefail
          # 安卓端由 adapter jar 提供 @ohos.*，iOS 端是独立的动态 framework。
          # 只链接 libarkui_ios 会让 net.http / file.fs / router / preferences
          # 在运行时变成 undefined（首页加载失败、页面不跳转、设置页闪退）。
          python3 scripts/prepare_ios_plugins.py \
            --sdk-zip /tmp/arkui-x-macos-sdk.zip \
            --arch-dir ios-x86_64-simulator \
            --out "$PWD/build/ios-plugins" \
            --xcconfig "$PWD/build/ios-plugins.xcconfig"

      - name: Build simulator app
        run: |
          set -euo pipefail
          xcodebuild \
            -project .arkui-x/ios/app.xcodeproj \
            -target app \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch x86_64 \
            -xcconfig build/ios-plugins.xcconfig \
            CONFIGURATION_BUILD_DIR="$PWD/build/sim" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build
          mkdir -p build/sim/app.app/Frameworks
          cp -R build/ios-plugins/*.framework build/sim/app.app/Frameworks/
          ls -1 build/sim/app.app/Frameworks | head -n 40

      - name: Run app in simulator
        run: |
          set -euo pipefail
          run_with_timeout() { local t=$1; shift; perl -e 'alarm shift; exec @ARGV' "$t" "$@"; }
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "[$(date +%T)] simulator=$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          run_with_timeout 180 xcrun simctl boot "$UDID" || true
          run_with_timeout 240 xcrun simctl bootstatus "$UDID" -b || true
          echo "[$(date +%T)] boot check done"
          run_with_timeout 240 xcrun simctl install "$UDID" build/sim/app.app
          echo "[$(date +%T)] installed"
          DATA=$(xcrun simctl get_app_container "$UDID" com.wuyin.video data || true)
          if [ -n "$DATA" ]; then
            for d in "$DATA/Documents" "$DATA/Documents/files" "$DATA/Library/files" "$DATA/Library/Application Support" "$DATA/tmp"; do
              mkdir -p "$d"
              printf '1' > "$d/agreement_accepted.txt"
            done
          fi
          set +e
          SIMCTL_CHILD_WUYIN_SMOKE=1 run_with_timeout 60 xcrun simctl launch --terminate-running-process "$UDID" com.wuyin.video > /tmp/launch.txt 2>&1
          launch_rc=$?
          echo "[$(date +%T)] launched rc=$launch_rc"
          # 冒烟测试约 45 秒，之后回到首页再截屏。
          sleep 55
          run_with_timeout 60 xcrun simctl io "$UDID" screenshot /tmp/sim.png
          echo "[$(date +%T)] screenshot done"
          run_with_timeout 90 xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "app"' > /tmp/app.log 2>&1
          echo "[$(date +%T)] log collected $(wc -l < /tmp/app.log 2>/dev/null || echo 0) lines"
          set -e
          echo "launch_rc=$launch_rc"
          cat /tmp/launch.txt || true
          echo "--- app log ---"
          cat /tmp/app.log || true
          {
            echo "## iOS simulator log"
            echo "launch_rc=$launch_rc"
            echo '```'
            tail -n 500 /tmp/app.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect crash diagnostics
        if: always()
        run: |
          set +e
          {
            echo "## crash diagnostics"
            echo "### app process"
            xcrun simctl spawn "$UDID" launchctl list | grep -i wuyin || true
            echo "### unified log (SMOKE/errors)"
            perl -e 'alarm shift; exec @ARGV' 120 xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "app"' 2>/dev/null \
              | grep -iE 'SMOKE|ERROR|TypeError|Fatal|Exception|abort|bridge|http|accessSync|undefined|not support' \
              | tail -n 400 || true
            echo "### runtime.log"
            DATA=$(xcrun simctl get_app_container "$UDID" com.wuyin.video data || true)
            if [ -n "$DATA" ]; then
              find "$DATA" -name runtime.log -type f -print -exec tail -n 200 {} \; || true
            fi
            echo "### simulator crash reports"
            for f in $(find "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs" -type f -mmin -20 \( -iname '*app*' -o -iname '*wuyin*' \) 2>/dev/null); do
              echo "== $f"
              head -n 60 "$f"
            done
            echo "### sample"
            PID=$(pgrep -f 'app.app/app' | head -n 1 || true)
            echo "pid=$PID"
            if [ -n "$PID" ]; then
              sample "$PID" 1 1 -file /tmp/sample.txt || true
              head -n 120 /tmp/sample.txt || true
            fi
          } > /tmp/crash.log 2>&1
          cat /tmp/crash.log
          cat /tmp/crash.log >> "$GITHUB_STEP_SUMMARY"

      - name: Publish log as check run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f /tmp/app.log || exit 0
          cat /tmp/app.log /tmp/crash.log > /tmp/all.log 2>/dev/null || true
          {
            echo "### matched errors"
            grep -iE 'error|fail|exception|not found|dlopen|LoadModuleLibrary|uicontext|TypeError|undefined|crash|SIGABRT|SIGSEGV' /tmp/all.log | tail -n 120 || true
            echo "### tail"
            tail -n 150 /tmp/all.log
          } > /tmp/app-tail.log
          jq -n --rawfile summary /tmp/app-tail.log --arg sha "$GITHUB_SHA" \
            '{name:"ios-sim-log", head_sha:$sha, status:"completed", conclusion:"failure", output:{title:"iOS simulator log", summary:$summary}}' \
            > /tmp/check.json
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input /tmp/check.json

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-diagnostics
          path: |
            /tmp/app.log
            /tmp/crash.log
            /tmp/sim.png
          if-no-files-found: warn

      - name: Publish diagnostics release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ios-sim-diag-$(date -u +%Y%m%d-%H%M%S)"
          if [ -s /tmp/crash.log ]; then
            head -c 100000 /tmp/crash.log > /tmp/crash-notes.md
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "iOS simulator diagnostics ${GITHUB_SHA::7}" \
              --notes-file /tmp/crash-notes.md
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "iOS simulator diagnostics ${GITHUB_SHA::7}" \
              --notes "No crash log captured."
          fi
          if [ -s /tmp/sim.png ]; then
            gh release upload "$tag" /tmp/sim.png --repo "$GITHUB_REPOSITORY" --clobber || true
          fi
          echo "diagnostics_release=$tag" >> "$GITHUB_STEP_SUMMARY"
