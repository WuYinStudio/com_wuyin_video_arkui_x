name: iOS unsigned build

# 说明：
#   - 这是“无签名 iOS 包”的 macOS 云构建模板，不依赖 Apple 开发者证书。
#   - workflow 会自动从华为 CDN 下载 macOS 版 ArkUI-X SDK，取出
#     libarkui_ios.xcframework；不需要配置任何 Secret。
#   - 首次运行会下载约 542 MB，之后使用 Actions cache。
#   - 未签名 ipa 不能直接装到未越狱设备，只适合后续重签或 CI 验证。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    # 用 Intel 版 macOS runner，避开 macos-14/15 arm64 的排队瓶颈；
    # macOS 26 自带 Xcode 26，与 ArkUI-X 26 SDK 匹配。
    runs-on: macos-26-intel
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache ArkUI-X macOS SDK
        uses: actions/cache@v4
        with:
          path: /tmp/arkui-x-macos-sdk.zip
          key: arkui-x-macos-sdk-26.0.0.28

      - name: Download libarkui_ios.xcframework
        run: |
          set -euo pipefail
          SDK_URL="https://contentcenter-drcn.dbankcdn.cn/pub_1/DevEcoSpace_1_900_9/6f/v3/x-GBbqu3So2gK5Y1dc-Blw/nxSlk9koR_-dKDUKV4c26Q.zip"
          SDK_SHA256="ee213c09196d4f0433273b65b7c6665083fbb7cef186257fe4bba382744fc9d0"
          if [ ! -f /tmp/arkui-x-macos-sdk.zip ]; then
            curl -L --fail --retry 3 "$SDK_URL" -o /tmp/arkui-x-macos-sdk.zip
          fi
          echo "$SDK_SHA256  /tmp/arkui-x-macos-sdk.zip" | shasum -a 256 -c -
          rm -rf /tmp/arkui-x-framework
          mkdir -p /tmp/arkui-x-framework
          unzip -q /tmp/arkui-x-macos-sdk.zip \
            'arkui-x/engine/xcframework/arkui/ios-release/libarkui_ios.xcframework/*' \
            -d /tmp/arkui-x-framework
          mkdir -p .arkui-x/ios/frameworks
          rm -rf .arkui-x/ios/frameworks/libarkui_ios.xcframework
          cp -R /tmp/arkui-x-framework/arkui-x/engine/xcframework/arkui/ios-release/libarkui_ios.xcframework \
            .arkui-x/ios/frameworks/

      - name: Show Xcode
        run: xcodebuild -version

      - name: Build unsigned IPA
        env:
          IOS_CONFIGURATION: ${{ inputs.configuration }}
        run: bash scripts/build_unsigned_ios.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: wuyin-ios-unsigned-${{ inputs.configuration }}
          path: build/ios-unsigned/app-unsigned.ipa
          if-no-files-found: error
